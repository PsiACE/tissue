[package]
name = "tissue"
version = "0.1.0"
edition = "2021"
authors = ["PsiACE <psiace@apache.org>"]
description = "A Rust framework for creating interactive machine learning model demos"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PsiACE/tissue"
homepage = "https://github.com/PsiACE/tissue"
documentation = "https://docs.rs/tissue"
keywords = ["machine-learning", "gui", "demo", "interactive", "ml"]
categories = ["gui", "science", "web-programming"]
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tao = "0.33"
wry = "0.51"
num-traits = "0.2.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"], optional = true }

[features]
default = []
async = ["tokio"]

[dev-dependencies]
tokio-test = "0.4"

[[example]]
name = "addition"
path = "examples/addition.rs"
